<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Журнал партий</title>
</head>
<body>
    <header class="header">
      <div class="container">
        <div class="header_headline">
          <h1 class="header_headerline-text">Журнал партий</h1>
        </div>
      </div>
    </header>
    <main class="main">
      <div class="contaner">
        <div class="main_form">
          <form action="" class="main_form-magazine" method="get">
            <label class="main_form-magazine_party_name" for="party_name">Название партии:</label>
              <input class="main_form-magazine_party_name-input" type="text" id="party_name" name="party_name" required>
            <label class="main_form-magazine_party_size" for="party_size">Объём, л:</label>
              <input class="main_form-magazine_party_size-input" type="text" id="party_size" name="party_size" required>
                <button type="submit">Добавить</button>  
          </form>
        </div>
      </div>
    </main>
</body>
</html>
